<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shreenath Team Work</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#38bdf8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:#e0f2fe;color:#000;font-size:16px}
header{position:sticky;top:0;z-index:5;background:#38bdf8;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header img{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2;min-width:0}
header small{display:block;font-weight:400;font-size:12px}
.hbtn{background:rgba(255,255,255,.6);border:0;border-radius:10px;padding:8px 9px;font-size:14px;color:#000}
main{padding:12px 12px 100px;max-width:720px;margin:0 auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex:0 0 auto;border:0;background:#fff;border-radius:20px;padding:8px 14px;font-size:14px;color:#000}
.chip.on{background:#38bdf8;font-weight:700}
.chip b{margin-left:4px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font-size:17px}
.muted{color:#444;font-size:13px}
.badge{font-size:12px;border-radius:10px;padding:3px 9px;white-space:nowrap;font-weight:600}
.s-todo{background:#e5e7eb}.s-in_progress{background:#fde68a}.s-done{background:#bbf7d0}.s-incomplete{background:#fecaca}
.bar{height:8px;background:#e5e7eb;border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#0ea5e9}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:10px;background:#38bdf8;color:#000;padding:11px 14px;font-size:15px;font-weight:600}
.btn.sec{background:#e0f2fe}.btn.red{background:#fecaca}.btn.full{width:100%}
a.btn{text-decoration:none;display:inline-block}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #bae6fd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 2px;font-size:12px;line-height:1.2;color:#000}
nav button.on{background:#bae6fd;font-weight:700}
nav button span{display:block;font-size:20px}
.fab{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:6;border:0;background:#0284c7;color:#fff;border-radius:28px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.show{display:flex}
#sheet .box{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font-size:16px;padding:11px;border:1px solid #7dd3fc;border-radius:10px;background:#fff;color:#000;font-family:inherit}
textarea{min-height:70px}
input[type=range]{padding:0}
input[type=checkbox]{width:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid #bae6fd;background:#fff;border-radius:10px;padding:11px 6px;font-size:15px;color:#000}
.seg button.on{border-color:#0284c7;background:#e0f2fe;font-weight:700}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid #bae6fd}
.hist{font-size:13px;border-left:3px solid #7dd3fc;padding-left:8px;margin:8px 0}
.login{max-width:380px;margin:30px auto;padding:0 16px;text-align:center}
.login img{width:96px;height:96px;border-radius:20px;background:#fff;object-fit:contain}
.login h2{margin:10px 0 2px}
.login .form{text-align:left}
.banner{background:#fef3c7;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.empty{text-align:center;color:#444;padding:30px 10px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;display:none;max-width:90%;text-align:center}
.err{color:#b91c1c;font-size:14px;margin-top:8px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.sum div{background:#fff;border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}
.sum b{display:block;font-size:16px;margin-top:2px}
.money{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:14px}
.pay{border-bottom:1px solid #e5e7eb;padding:8px 0}
.search{margin-bottom:10px}
#printarea{display:none}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ph img{width:64px;height:64px;border-radius:10px}
.ph h1{margin:0;font-size:18px}.ph h2{margin:2px 0;font-size:15px}
.rt{width:100%;border-collapse:collapse;font-size:12px}
.rt th,.rt td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}
.rt th{background:#d9f0fb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rt thead{display:table-header-group}.rt tr{page-break-inside:avoid}
@media print{
  body>*:not(#printarea){display:none!important}
  body{background:#fff}
  #printarea{display:block!important;color:#000}
}
.trow{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #e5e7eb;padding:9px 0;margin-top:6px}
.trow .bar{margin-top:6px}
</style>
</head>

let lang = localStorage.getItem("tw_lang") || "mr";
const t = k => { const v = (TX[lang]||{})[k]; return v!==undefined ? v : (TX.en[k]!==undefined?TX.en[k]:k); };
const wt = w => { if(lang==="mr") return WT_MR[w]||w; const k=stageOf(w); return k==="other" ? w : t("stg_"+k); };
const stLabel = s => t(s);   // todo / in_progress / done / incomplete
function toggleLang(){ lang = lang==="mr"?"en":"mr"; localStorage.setItem("tw_lang",lang); closeSheet(); if(S.me) render(); else boot(); }

let S = {token:null, me:null, tasks:[], sites:[], members:[], view:"work", filter:"today", who:"all", offline:false, q:"", sf:"open", mf:"due", stage:"structure", wtype:"all", sel:[], selMode:false};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toLocaleDateString("en-CA");
const fmtDate = d => !d ? t("not_sched") : new Date(d+"T00:00:00").toLocaleDateString(lang==="mr"?"mr-IN-u-nu-latn":"en-IN",{weekday:"short",day:"numeric",month:"short"});
const rs = n => "₹" + Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const isAdmin = () => S.me && S.me.role === "admin";
const canPay = () => isAdmin() && S.me.can_pay;
const teamMembers = () => S.members.filter(m=>m.active && m.role==="member");

function toast(m){const e=$("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800);}

async function api(fn, args){
  const r = await fetch(URL_+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args||{})});
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok){
    const msg=(j&&j.message)||"Something went wrong";
    if(msg.indexOf("SESSION_EXPIRED")>=0){ localStorage.removeItem("tw_token"); S.token=null; S.me=null; showLogin(t("login_again")); throw new Error("Session expired"); }
    if(msg.indexOf("NOT_ALLOWED")>=0) throw new Error("You are not allowed to do this");
    throw new Error(msg);
  }
  return j;
}
const T = () => ({p_token:S.token});

/* ---------- start ---------- */
async function boot(){
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  S.token = localStorage.getItem("tw_token");
  if(S.token){
    try{ S.me = await api("me",T()); S.view=isAdmin()?"sites":"work"; await loadAll(); render(); startTimer(); return; }
    catch(e){ if(!S.token){return;} if(!navigator.onLine){ const c=loadCache(); if(c){S.me=c.me;S.view=isAdmin()?"sites":"work";S.tasks=c.tasks;S.sites=c.sites;S.members=c.members;S.offline=true;render();return;} } }
  }
  try{ const need = await api("setup_needed"); need ? showSetup() : showLogin(); }
  catch(e){ showLogin(t("no_net_open")); }
}
function saveCache(){ try{localStorage.setItem("tw_cache",JSON.stringify({me:S.me,tasks:S.tasks,sites:S.sites,members:S.members}));}catch(e){} }
function loadCache(){ try{return JSON.parse(localStorage.getItem("tw_cache"));}catch(e){return null;} }

async function loadAll(){
  try{
    const jobs=[api("list_tasks",T()),api("list_sites",T())];
    if(isAdmin()) jobs.push(api("list_members",T()));
    const r=await Promise.all(jobs);
    S.tasks=r[0]||[]; S.sites=r[1]||[]; if(isAdmin()) S.members=r[2]||[];
    S.offline=false; saveCache();
  }catch(e){
    if(!S.token) throw e;
    const c=loadCache(); if(c && c.me && S.me && c.me.id===S.me.id){S.tasks=c.tasks;S.sites=c.sites;S.members=c.members;}
    S.offline=true;
  }
}
async function refresh(manual){ await loadAll(); render(); if(manual) toast(S.offline?t("no_net"):t("updated")); }
function startTimer(){
  clearInterval(startTimer.t);
  startTimer.t=setInterval(()=>{ if(document.visibilityState==="visible" && S.token && !$("sheet").classList.contains("show")) refresh(); },60000);
  if(!startTimer.v){ startTimer.v=true; document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.token && !$("sheet").classList.contains("show")) refresh(); }); }
}

/* ---------- login ---------- */

function showLogin(msg){
  $("app").innerHTML=`<div class="login">${brand()}<div class="form">
  <label>${t("phone")}</label><input id="ph" type="tel" inputmode="numeric" autocomplete="username">
  <label>${t("pin")}</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
  <div class="err" id="lerr">${esc(msg||"")}</div>
  <div class="row"><button class="btn full" onclick="doLogin()">${t("login")}</button></div>
  <div class="row"><button class="btn sec full" onclick="toggleLang()">${t("lang")}</button></div></div></div>`;
}
async function doLogin(){
  try{
    const r=await api("login",{p_phone:$("ph").value,p_pin:$("pin").value});
    S.token=r.token; localStorage.setItem("tw_token",r.token); S.me=r; S.view=isAdmin()?"sites":"work"; S.filter="today";
    await loadAll(); render(); startTimer();
  }catch(e){ $("lerr").textContent=e.message; }
}
function showSetup(){
  $("app").innerHTML=`<div class="login">${brand()}<div class="form"><h3>${t("setup_title")}</h3>
  <p class="muted">${t("setup_help")}</p>
  <label>${t("your_name")}</label><input id="sn">
  <label>${t("your_phone")}</label><input id="sp" type="tel" inputmode="numeric">
  <label>${t("choose_pin")}</label><input id="spin" type="password" inputmode="numeric" maxlength="6">
  <div class="err" id="lerr"></div>
  <div class="row"><button class="btn full" onclick="doSetup()">${t("create_acc")}</button></div></div></div>`;
}
async function doSetup(){
  try{
    if(!$("sn").value.trim()||!$("sp").value.trim()) throw new Error(t("fill_np"));
    const r=await api("setup_admin",{p_name:$("sn").value,p_phone:$("sp").value,p_pin:$("spin").value});
    S.token=r.token; localStorage.setItem("tw_token",r.token); S.me=r;
    await loadAll(); render(); startTimer();
  }catch(e){ $("lerr").textContent=e.message; }
}
async function logout(){
  try{ await api("logout",T()); }catch(e){}
  localStorage.removeItem("tw_token"); localStorage.removeItem("tw_cache"); S.token=null; S.me=null; showLogin();
}

/* ---------- filters ---------- */
const TODAY = () => today();
const FILTERS = {
  today:t0=>t0.work_date===TODAY(),
  in_progress:t0=>t0.status==="in_progress",
  incomplete:t0=>t0.status==="incomplete"||(t0.work_date<TODAY()&&t0.status==="todo"),
  upcoming:t0=>t0.work_date>TODAY()&&t0.status==="todo",
  done:t0=>t0.status==="done"
};
function visibleTasks(){ return S.tasks.filter(x=> S.who==="all" || (S.who==="none" ? !x.assigned_to : x.assigned_to===S.who)); }

/* ---------- render ---------- */
function render(){
  const a=isAdmin();
  let body="";
  if(S.view==="work") body=workView();
  else if(S.view==="sites") body=sitesView();
  else if(S.view==="team") body=teamView();
  else if(S.view==="money") body=moneyView();
  else if(S.view==="stages") body=stagesView();
  const nav=a?`<nav>
    <button class="${S.view==="sites"?"on":""}" onclick="go('sites')"><span>🏠</span>${t("nav_sites")}</button>
    <button class="${S.view==="work"?"on":""}" onclick="go('work')"><span>📋</span>${t("nav_work")}</button>
    <button class="${S.view==="stages"?"on":""}" onclick="go('stages')"><span>🧱</span>${t("nav_stages")}</button>
    ${canPay()?`<button class="${S.view==="money"?"on":""}" onclick="go('money')"><span>💰</span>${t("nav_money")}</button>`:""}
    <button class="${S.view==="team"?"on":""}" onclick="go('team')"><span>👥</span>${t("nav_team")}</button></nav>`:"";
  const pdfRow = a ? `<div class="row" style="justify-content:flex-end;margin:0 0 8px"><button class="btn sec" onclick="doBackup()">${t("bk_btn")}</button>${S.view!=="team"?`<button class="btn sec" onclick="openReport()">${t("pdf_btn")}</button>`:""}</div>` : "";
  const fabAct = S.view==="sites"?"openSiteForm()":S.view==="team"?"openMemberForm()":"openTaskForm()";
  const fabTxt = S.view==="sites"?t("add_site"):S.view==="team"?t("add_member"):t("add_work");
  const fab = (a && S.view!=="money" && S.view!=="stages") ?`<button class="fab" onclick="${fabAct}">${fabTxt}</button>` : "";
  $("app").innerHTML=`<header><img src="${LOGO}" alt=""><h1>${esc(COMPANY)}<small>${esc(S.me.name)} · ${a?t("admin"):t("sub")}</small></h1>
    <button class="hbtn" onclick="toggleLang()">${t("lang")}</button><button class="hbtn" onclick="refresh(true)">⟳</button><button class="hbtn" onclick="logout()">🚪</button></header>
    <main>${S.offline?`<div class="banner">${t("offline")}</div>`:""}${pdfRow}${body}</main>${nav}${fab}`;
}
function go(v){S.view=v;S.q="";S.selMode=false;S.sel=[];render();window.scrollTo(0,0);}
function setFilter(f){S.filter=f;render();}
function setWho(v){S.who=v;render();}
function setQ(v){S.q=v; const p=$("plist"); if(p){ p.innerHTML=listHtml(); } }

function workView(){
  const vt0=visibleTasks();
  const vt=S.wtype==="all"?vt0:vt0.filter(x=>stageOf(x.work_type)===S.wtype);
  const chips=Object.keys(FILTERS).map(k=>{
    const n=vt.filter(FILTERS[k]).length;
    return `<button class="chip ${S.filter===k?"on":""}" onclick="setFilter('${k}')">${t(k)}<b>${n}</b></button>`;
  }).join("");
  const tchips=[["all",t("s_all"),vt0.filter(FILTERS[S.filter]).length]].concat(STAGE_ORDER.map(k=>[k,t("stg_"+k),vt0.filter(x=>stageOf(x.work_type)===k).filter(FILTERS[S.filter]).length]))
    .map(c=>`<button class="chip ${S.wtype===c[0]?"on":""}" onclick="S.wtype='${c[0]}';render()">${c[1]}<b>${c[2]}</b></button>`).join("");
  let who="";
  if(isAdmin()){
    who=`<select onchange="setWho(this.value)" style="margin-bottom:10px"><option value="all">${t("all_team")}</option><option value="none" ${S.who==="none"?"selected":""}>${t("unassigned")}</option>${teamMembers().map(m=>`<option value="${m.id}" ${S.who===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>`;
  }
  let list=vt.filter(FILTERS[S.filter]);
  list.sort((x,y)=> S.filter==="done" ? (y.updated_at>x.updated_at?1:-1) : ((x.work_date||"9")===(y.work_date||"9") ? x.site_name.localeCompare(y.site_name) : ((x.work_date||"9")<(y.work_date||"9")?-1:1)));
  const cards=groupBySite(list).map(siteCard).join("") || `<div class="empty">${S.filter==="today"?t("no_today"):t("nothing")}</div>`;
  const hello=S.filter==="today"?`<p class="muted" style="margin:4px 2px 10px">${fmtDate(TODAY())}</p>`:"";
  return `<div class="chips">${chips}</div><div class="chips">${tchips}</div>${who}${hello}${cards}`;
}
/* one card per site; each stage of that site is a row inside it (the name is never repeated) */
function groupBySite(list){
  const m=new Map();
  list.forEach(x=>{ if(!m.has(x.site_id)) m.set(x.site_id,{site_id:x.site_id,name:x.site_name,address:x.address,capacity:x.capacity,items:[]}); m.get(x.site_id).items.push(x); });
  return [...m.values()];
}
const stageRank = w => STAGE_ORDER.indexOf(stageOf(w));
function siteCard(g){
  const items=g.items.slice().sort((a,b)=>stageRank(a.work_type)-stageRank(b.work_type));
  return `<div class="card"><div class="top"><h3>${esc(g.name)}</h3>${g.capacity?`<span class="muted">${esc(g.capacity)}</span>`:""}</div>
  ${g.address?`<div class="muted">📍 ${esc(g.address)}</div>`:""}
  ${items.map(x=>{
    const late = x.work_date && x.work_date<TODAY() && x.status!=="done";
    return `<div class="trow" onclick="openTask('${x.id}')"><div style="min-width:0"><b>${esc(wt(x.work_type))}</b>
      <div class="muted">${isAdmin()?"👤 "+(x.assignee?esc(x.assignee):"<b style='color:#b91c1c'>"+t("unassigned")+"</b>")+" · ":""}📅 ${fmtDate(x.work_date)}${late?" <b style='color:#b91c1c'>"+t("earlier")+"</b>":""}${x.photo_count>0?" · 📷 "+x.photo_count:""}</div>
      ${x.note?`<div class="muted">📝 ${esc(x.note)}</div>`:""}
      ${x.status==="in_progress"?`<div class="bar"><i style="width:${x.progress}%"></i></div>`:""}</div>
      <span class="badge s-${x.status}">${stLabel(x.status)}${x.status==="in_progress"?" "+x.progress+"%":""}</span></div>`;
  }).join("")}</div>`;
}

/* ----- stage lists: Structure / Panel + Inverter / Wiring / Other ----- */
function stageTasks(k){ return S.tasks.filter(x=>stageOf(x.work_type)===k && x.status!=="done"); }
function stagesView(){
  const chips=STAGE_ORDER.map(k=>`<button class="chip ${S.stage===k?"on":""}" onclick="S.stage='${k}';S.sel=[];render()">${t("stg_"+k)}<b>${stageTasks(k).length}</b></button>`).join("");
  const bar = S.selMode
    ? `<div class="row" style="margin:0 0 10px"><button class="btn sec" onclick="selAll()">${t("sel_all")}</button><button class="btn" onclick="bulkAssign()">${t("assign_sel")} (${S.sel.length})</button><button class="btn sec" onclick="S.selMode=false;S.sel=[];render()">${t("cancel")}</button></div>`
    : `<div class="row" style="margin:0 0 10px"><button class="btn sec" onclick="S.selMode=true;S.sel=[];render()">${t("select")}</button></div>`;
  return `<div class="chips">${chips}</div>${bar}<input class="search" placeholder="${t("search")}" value="${esc(S.q)}" oninput="setQ(this.value)"><div id="plist">${stagesList()}</div>`;
}
function stagesShown(){
  const ql=S.q.trim().toLowerCase();
  return stageTasks(S.stage).filter(x=>!ql||(x.site_name+" "+(x.address||"")+" "+(x.assignee||"")).toLowerCase().indexOf(ql)>=0)
    .sort((a,b)=>(a.address||"~").localeCompare(b.address||"~")||a.site_name.localeCompare(b.site_name));
}
function stagesList(){
  const l=stagesShown();
  if(!l.length) return `<div class="empty">${t("stage_none")}</div>`;
  return l.map(x=>{
    const site=S.sites.find(z=>z.id===x.site_id)||{};
    const on=S.sel.includes(x.id);
    return `<div class="card" style="display:flex;gap:10px;align-items:center" onclick="${S.selMode?`toggleSel('${x.id}')`:`openTask('${x.id}')`}">
      ${S.selMode?`<input type="checkbox" ${on?"checked":""} style="width:22px;height:22px;pointer-events:none">`:""}
      <div style="flex:1;min-width:0"><h3>${esc(x.site_name)}</h3>
      <div class="muted">${[x.address,x.capacity,site.panel_company].filter(Boolean).map(esc).join(" · ")}</div>
      <div class="muted">${x.assignee?"👤 "+esc(x.assignee):"<b style='color:#b91c1c'>"+t("unassigned")+"</b>"} · 📅 ${fmtDate(x.work_date)}</div>
      ${x.status==="in_progress"?`<div class="bar"><i style="width:${x.progress}%"></i></div>`:""}</div>
      <span class="badge s-${x.status}">${stLabel(x.status)}${x.status==="in_progress"?" "+x.progress+"%":""}</span></div>`;
  }).join("");
}
function toggleSel(id){ const i=S.sel.indexOf(id); if(i>=0) S.sel.splice(i,1); else S.sel.push(id); render(); }
function selAll(){ S.sel=stagesShown().map(x=>x.id); render(); }
function bulkAssign(){
  if(!S.sel.length){ toast(t("none_sel")); return; }
  const mem=teamMembers();
  openSheet(`<h2 style="margin:0">${t("assign_sel")}</h2><div class="muted">${t("sel_n")(S.sel.length)} · ${t("stg_"+S.stage)}</div>
  <label>${t("assign_one")}</label><select id="b_who"><option value="">—</option>${mem.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>
  <label>${t("assign_date_opt")}</label><input type="date" id="b_date" value="${TODAY()}">
  <div class="row"><button class="btn full" id="b_save">${t("save")}</button><button class="btn sec full" onclick="closeSheet()">${t("cancel")}</button></div>`);
  $("b_save").onclick=async()=>{
    if(!$("b_who").value){ toast(t("pick_member")); return; }
    $("b_save").disabled=true;
    try{
      for(const id of S.sel){
        const x=S.tasks.find(z=>z.id===id); if(!x) continue;
        await api("save_task",{p_token:S.token,p_id:x.id,p_site_id:x.site_id,p_assigned_to:$("b_who").value,p_work_type:x.work_type,p_details:x.details,p_work_date:$("b_date").value||null});
      }
      S.sel=[]; S.selMode=false; closeSheet(); await refresh(); toast(t("saved"));
    }catch(e){ toast(e.message); $("b_save").disabled=false; }
  };
}

/* ----- sites ----- */
function siteOpenTasks(id){ return S.tasks.filter(x=>x.site_id===id&&x.status!=="done"); }
function sitesView(){
  const chips=[["open",t("s_open")],["finished",t("s_finished")],["all",t("s_all")]].map(c=>`<button class="chip ${S.sf===c[0]?"on":""}" onclick="S.sf='${c[0]}';render()">${c[1]}</button>`).join("");
  return `<div class="chips">${chips}</div><input class="search" placeholder="${t("search")}" value="${esc(S.q)}" oninput="setQ(this.value)"><div id="plist">${listHtml()}</div>`;
}
function matchQ(s){ const q=S.q.trim().toLowerCase(); if(!q) return true; return [s.name,s.address,s.customer,s.panel_company].join(" ").toLowerCase().indexOf(q)>=0; }
function listHtml(){
  if(S.view==="sites") return sitesList();
  if(S.view==="money") return moneyList();
  if(S.view==="stages") return stagesList();
  return "";
}
function sitesList(){
  let l=S.sites.filter(s=>S.sf==="all"||(S.sf==="open"?!s.closed:s.closed)).filter(matchQ);
  if(!l.length) return `<div class="empty">${t("no_sites")}</div>`;
  return l.map(s=>{
    const open=siteOpenTasks(s.id);
    return `<div class="card" onclick="openSiteForm('${s.id}')">
      <div class="top"><div><h3>${esc(s.name)}</h3><div class="muted">${[s.capacity,s.panel_company].filter(Boolean).map(esc).join(" · ")}</div></div>
      <span class="badge ${s.closed?"s-done":open.length?"s-in_progress":"s-todo"}">${s.closed?t("closed"):open.length?t("pending_n")(open.length):t("no_pending")}</span></div>
      ${s.address?`<div class="muted" style="margin-top:6px">📍 ${esc(s.address)}</div>`:""}

function workDoneText(siteId){
  const ks=STAGE_ORDER.filter(k=>S.tasks.some(x=>x.site_id===siteId && x.status==="done" && stageOf(x.work_type)===k));
  return `<div style="margin-top:6px;font-size:13px"><b>${t("work_done")} –</b> ${ks.length?ks.map(k=>esc(t("stg_"+k))).join(", "):t("none_yet")}</div>`;
}
const bal = s => (s.total_amount==null) ? null : Number(s.total_amount)-Number(s.paid||0);
function moneyView(){
  const priced=S.sites.filter(s=>s.total_amount!=null);
  const total=priced.reduce((a,s)=>a+Number(s.total_amount),0);
  const recv=S.sites.reduce((a,s)=>a+Number(s.paid||0),0);
  const due=priced.reduce((a,s)=>a+Math.max(0,bal(s)),0);
  const cnt={due:priced.filter(s=>bal(s)>0).length,noprice:S.sites.filter(s=>s.total_amount==null).length,paid:priced.filter(s=>bal(s)<=0).length};
  const chips=[["due",t("c_due")],["noprice",t("c_noprice")],["paid",t("c_paid")]].map(c=>`<button class="chip ${S.mf===c[0]?"on":""}" onclick="S.mf='${c[0]}';render()">${c[1]}<b>${cnt[c[0]]}</b></button>`).join("");
  return `<div class="sum"><div>${t("m_total")}<b>${rs(total)}</b></div><div>${t("m_recv")}<b>${rs(recv)}</b></div><div>${t("m_bal")}<b style="color:#b91c1c">${rs(due)}</b></div></div>
  <div class="chips">${chips}</div><input class="search" placeholder="${t("search")}" value="${esc(S.q)}" oninput="setQ(this.value)"><div id="plist">${moneyList()}</div>`;
}
function moneyList(){
  let l=S.sites.filter(matchQ).filter(s=> S.mf==="noprice" ? s.total_amount==null : S.mf==="due" ? (s.total_amount!=null&&bal(s)>0) : (s.total_amount!=null&&bal(s)<=0));
  if(S.mf==="due") l.sort((a,b)=>bal(b)-bal(a));
  if(!l.length) return `<div class="empty">${t("nothing")}</div>`;
  return l.map(s=>`<div class="card" onclick="openPay('${s.id}')">
    <div class="top"><div><h3>${esc(s.name)}</h3><div class="muted">${esc(s.address||"")}${s.capacity?(s.address?" · ":"")+esc(s.capacity):""}</div></div>
    ${s.total_amount==null?`<span class="badge s-incomplete">${t("price_not_set")}</span>`:`<span class="badge ${bal(s)>0?"s-in_progress":"s-done"}">${bal(s)>0?t("m_bal")+" "+rs(bal(s)):t("c_paid")}</span>`}</div>

}

function viewPhoto(src){
  const d=document.createElement("div");
  d.style.cssText="position:fixed;inset:0;background:#000;z-index:40;display:flex;align-items:center;justify-content:center";
  d.innerHTML=`<img src="${src}" style="max-width:100%;max-height:100%">`; d.onclick=()=>d.remove(); document.body.appendChild(d);
}
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=window.URL.createObjectURL(file);
    img.onload=()=>{
      let max=1000,q=.6,out="";
      for(let i=0;i<6;i++){
        const sc=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        out=c.toDataURL("image/jpeg",q);
        if(out.length<500000) break;
        max=Math.round(max*.8); q=Math.max(.4,q-.05);
      }
      window.URL.revokeObjectURL(u);
      out.length<590000?res(out):rej(new Error("Photo too large"));
    };
    img.onerror=()=>rej(new Error("Cannot read this photo")); img.src=u;
  });
}

  <label>${m?t("pin_new"):t("pin_req")}</label><input id="m_pin" inputmode="numeric" maxlength="6">
  <label>${t("role")}</label><select id="m_role"><option value="member" ${!m||m.role==="member"?"selected":""}>${t("r_member")}</option><option value="admin" ${m&&m.role==="admin"?"selected":""}>${t("r_admin")}</option></select>
  ${canPay()?`<label class="chk" id="m_paywrap"><input type="checkbox" id="m_pay" ${m&&m.can_pay?"checked":""}> ${t("can_pay")}</label>`:""}
  ${m?`<label class="chk"><input type="checkbox" id="m_act" ${m.active?"checked":""}> ${t("active")}</label>`:""}
  <div class="row"><button class="btn full" id="m_save">${t("save")}</button><button class="btn sec full" onclick="closeSheet()">${t("cancel")}</button></div>`);
  const sync=()=>{ const w=$("m_paywrap"); if(w) w.style.display=$("m_role").value==="admin"?"flex":"none"; };
  $("m_role").onchange=sync; sync();
  $("m_save").onclick=async()=>{
    if(!$("m_name").value.trim()||!$("m_ph").value.trim()){toast(t("fill_np"));return;}
    $("m_save").disabled=true;
    try{
      await api("save_member",{p_token:S.token,p_id:m?m.id:null,p_name:$("m_name").value,p_phone:$("m_ph").value,p_pin:$("m_pin").value,p_role:$("m_role").value,p_active:m?$("m_act").checked:true,p_can_pay:canPay()?($("m_role").value==="admin"&&$("m_pay").checked):null});
      closeSheet(); await refresh(); toast(t("saved"));
    }catch(e){ toast(/duplicate|unique/i.test(e.message)?t("dup_phone"):e.message); $("m_save").disabled=false; }
  };
}

/* ---------- PDF report (admin) ---------- */
const siteOf = id => S.sites.find(z=>z.id===id)||{};
function rptDefs(){
  const d=[];
  STAGE_ORDER.forEach(k=>d.push({id:"stage_"+k,kind:"task",label:t("stg_"+k)+" — "+t("pending_w"),get:()=>stageTasks(k)}));
  ["today","in_progress","incomplete","upcoming","done"].forEach(k=>d.push({id:"w_"+k,kind:"task",label:t("nav_work")+": "+t(k),get:()=>S.tasks.filter(FILTERS[k])}));
  d.push({id:"s_open",kind:"site",label:t("l_sites_open"),get:()=>S.sites.filter(s=>!s.closed)});
  d.push({id:"s_fin",kind:"site",label:t("l_sites_fin"),get:()=>S.sites.filter(s=>s.closed)});
  d.push({id:"s_all",kind:"site",label:t("l_sites_all"),get:()=>S.sites});
  if(canPay()){
    d.push({id:"p_due",kind:"pay",label:t("l_pay_due"),get:()=>S.sites.filter(s=>s.total_amount!=null&&bal(s)>0)});
    d.push({id:"p_all",kind:"pay",label:t("l_pay_all"),get:()=>S.sites});
  }
  return d;
}
const RFIELDS = {
  task:[["no",1],["site",1],["village",1],["kw",1],["panel",0],["cust",0],["phone",0],["work",1],["who",1],["date",1],["status",1],["prog",0],["note",0]],
  site:[["no",1],["site",1],["village",1],["kw",1],["panel",1],["cust",0],["phone",1],["status",0],["pending",0]],
  pay:[["no",1],["site",1],["village",1],["kw",1],["total",1],["recv",1],["bal",1]]
};
function rptDefault(defs){
  let id = S.view==="stages" ? "stage_"+S.stage : S.view==="work" ? "w_"+S.filter
    : S.view==="sites" ? (S.sf==="finished"?"s_fin":S.sf==="all"?"s_all":"s_open")
    : S.view==="money" ? (S.mf==="due"?"p_due":"p_all") : "";
  return defs.find(z=>z.id===id) ? id : defs[0].id;
}
function rptVal(kind,r,f,i){
  if(f==="no") return i+1;
  if(kind==="task"){
    const s=siteOf(r.site_id);
    switch(f){
      case "site":return r.site_name; case "village":return r.address; case "kw":return r.capacity; case "panel":return s.panel_company;
      case "cust":return r.customer; case "phone":return r.customer_phone; case "work":return wt(r.work_type); case "who":return r.assignee||"—";
      case "date":return r.work_date?fmtDate(r.work_date):"—";
      case "status":return stLabel(r.status)+(r.status==="in_progress"?" "+r.progress+"%":""); case "prog":return r.progress+"%"; case "note":return r.note;
    }
  } else {
    switch(f){
      case "site":return r.name; case "village":return r.address; case "kw":return r.capacity; case "panel":return r.panel_company;
      case "cust":return r.customer; case "phone":return r.customer_phone; case "status":return r.closed?t("closed"):t("s_open");
      case "pending":return S.tasks.filter(x=>x.site_id===r.id&&x.status!=="done").map(x=>wt(x.work_type)).join(", ");
      case "total":return r.total_amount==null?"—":rs(r.total_amount); case "recv":return rs(r.paid); case "bal":return r.total_amount==null?"—":rs(bal(r));
    }
  }
  return "";
}
function openReport(){
  const defs=rptDefs(); let cur=rptDefault(defs); const chosen={};
  const kindOf=()=>defs.find(z=>z.id===cur).kind;
  const draw=()=>{
    const k=kindOf(); if(!chosen[k]) chosen[k]=RFIELDS[k].filter(f=>f[1]).map(f=>f[0]);
    $("r_fields").innerHTML=RFIELDS[k].map(f=>`<label class="chk"><input type="checkbox" value="${f[0]}" ${chosen[k].includes(f[0])?"checked":""}> ${esc(t("f_"+f[0]))}</label>`).join("");
  };
  openSheet(`<h2 style="margin:0">${t("rep_title")}</h2>
  <label>${t("rep_list")}</label><select id="r_list">${defs.map(d=>`<option value="${d.id}" ${d.id===cur?"selected":""}>${esc(d.label)}</option>`).join("")}</select>
  <label>${t("rep_fields")}</label><div id="r_fields" class="grid2"></div>
  <div class="muted" style="margin-top:8px">${t("rep_help")}</div>
  <div class="row"><button class="btn full" id="r_go">${t("rep_make")}</button><button class="btn sec full" onclick="closeSheet()">${t("cancel")}</button></div>`);
  draw();
  $("r_list").onchange=e=>{cur=e.target.value;draw();};
  $("r_fields").onchange=()=>{chosen[kindOf()]=[...document.querySelectorAll("#r_fields input:checked")].map(c=>c.value);};
  $("r_go").onclick=()=>{
    const fields=[...document.querySelectorAll("#r_fields input:checked")].map(c=>c.value);
    if(!fields.length){toast(t("rep_fields"));return;}
    const d=defs.find(z=>z.id===cur); closeSheet(); makeReport(d,fields);
  };
}
async function makeReport(def,fields){
  const rows=def.get().slice().sort((a,b)=>def.kind==="task"
    ? (a.address||"~").localeCompare(b.address||"~")||a.site_name.localeCompare(b.site_name)
    : (a.name||"").localeCompare(b.name||""));
  if(!rows.length){ toast(t("rep_none")); return; }
  const head=fields.map(f=>`<th>${esc(t("f_"+f))}</th>`).join("");
  const body=rows.map((r,i)=>`<tr>${fields.map(f=>{const v=rptVal(def.kind,r,f,i);return `<td>${esc(v==null?"":v)}</td>`;}).join("")}</tr>`).join("");
  let extra="";
  if(def.kind==="pay"){
    const priced=rows.filter(s=>s.total_amount!=null);
    const tt=priced.reduce((a,s)=>a+Number(s.total_amount),0), rr=rows.reduce((a,s)=>a+Number(s.paid||0),0), bb=priced.reduce((a,s)=>a+Math.max(0,bal(s)),0);
    extra=`<p><b>${t("f_total")}: ${rs(tt)} &nbsp;·&nbsp; ${t("f_recv")}: ${rs(rr)} &nbsp;·&nbsp; ${t("f_bal")}: ${rs(bb)}</b></p>`;
  }
  $("printarea").innerHTML=`<div class="ph"><img id="pimg" src="${LOGO}" alt=""><div><h1>${esc(COMPANY)}</h1><h2>${esc(def.label)}</h2><div>${t("rep_date")}: ${fmtDate(TODAY())} · ${t("rep_count")}: ${rows.length}</div></div></div><table class="rt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${extra}`;
  let st=$("pgstyle"); if(!st){ st=document.createElement("style"); st.id="pgstyle"; document.head.appendChild(st); }
  st.textContent="@page{size:A4 "+(fields.length>6?"landscape":"portrait")+";margin:12mm}";
  const img=$("pimg"); if(img && !img.complete) await new Promise(r=>{img.onload=img.onerror=r;});
  setTimeout(()=>window.print(),150);
}
window.addEventListener("afterprint",()=>{ const p=$("printarea"); if(p) p.innerHTML=""; });

/* ---------- backup (admin): one Excel file with all data ---------- */
function loadXlsx(){
  return new Promise((res,rej)=>{
    if(window.XLSX) return res();
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=res; s.onerror=()=>rej(new Error(t("bk_fail"))); document.head.appendChild(s);
  });
}
async function doBackup(){
  toast(t("bk_wait"));
  try{
    const [data]=await Promise.all([api("export_data",T()),loadXlsx()]);
    const wb=XLSX.utils.book_new();
    const sitesRows=S.sites.map(s=>{
      const r={}; r[t("f_site")]=s.name; r[t("f_village")]=s.address||""; r[t("f_kw")]=s.capacity||""; r[t("f_panel")]=s.panel_company||"";
      r[t("f_cust")]=s.customer||""; r[t("f_phone")]=s.customer_phone||""; r["Map"]=s.map_link||""; r[t("f_status")]=s.closed?t("closed"):t("s_open"); r[t("f_note")]=s.notes||"";
      if(canPay()){ r[t("f_total")]=s.total_amount==null?"":Number(s.total_amount); r[t("f_recv")]=Number(s.paid||0); r[t("f_bal")]=s.total_amount==null?"":Number(s.total_amount)-Number(s.paid||0); }
      return r;
    });
    const workRows=(data.tasks||[]).map(x=>{ const r={}; r[t("f_site")]=x.site; r[t("f_work")]=wt(x.work_type); r[t("f_who")]=x.assignee||""; r[t("f_date")]=x.work_date||"";
      r[t("f_status")]=stLabel(x.status); r[t("f_prog")]=x.progress+"%"; r[t("f_note")]=x.note||""; return r; });
    const add=(name,rows)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{}]),name);
    add("Sites",sitesRows); add("Work",workRows);
    if(data.payments){
      add("Payments",data.payments.map(p=>{ const r={}; r[t("f_site")]=p.site; r[t("f_date")]=p.paid_on; r[t("f_recv")]=Number(p.amount); r[t("stage")]=t("st")[p.stage]||p.stage; r[t("mode")]=t("md")[p.mode]||p.mode; r[t("f_note")]=p.note||""; r[t("by")]=p.by||""; return r; }));
    }
    add("Team",S.members.map(m=>{ const r={}; r[t("name").replace(" *","")]=m.name; r[t("f_phone")]=m.phone; r[t("role")]=m.role==="admin"?t("admin"):t("r_member").split(" (")[0]; r[t("active").split(" (")[0]]=m.active?"✔":"✘"; return r; }));
    XLSX.writeFile(wb,"Shreenath_Backup_"+TODAY()+".xlsx");
    toast(t("bk_done"));
  }catch(e){ toast(e.message||t("bk_fail")); }
}

boot();
</script>
